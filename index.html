<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roots Recruitment Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%B1</text></svg>" />

<!-- Firebase compat (no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<!-- PapaParse for CSV -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<!-- Babel (lets us write JSX in browser) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root {
  --primary:#4F46E5; --primary-hover:#4338CA; --primary-light:#EEF2FF;
  --success:#10B981; --success-light:#D1FAE5;
  --danger:#EF4444;  --danger-light:#FEE2E2;
  --warning:#F59E0B; --warning-light:#FEF3C7;
  --g50:#F9FAFB; --g100:#F3F4F6; --g200:#E5E7EB; --g300:#D1D5DB;
  --g400:#9CA3AF; --g500:#6B7280; --g700:#374151; --g900:#111827;
  --radius:8px; --shadow:0 1px 3px rgba(0,0,0,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--g50);color:var(--g900);font-size:14px;line-height:1.5}
a{color:var(--primary);text-decoration:none}
input,select,textarea,button{font-family:inherit;font-size:14px}

/* ── Layout ── */
.app{display:flex;flex-direction:column;min-height:100vh}
.header{background:#fff;border-bottom:1px solid var(--g200);display:flex;align-items:center;padding:0 20px;height:54px;position:sticky;top:0;z-index:100;gap:24px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border:none;border-radius:6px;background:none;color:var(--g500);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s}
.nav-btn:hover{color:var(--g900);background:var(--g100)}
.nav-btn.active{color:var(--primary);background:var(--primary-light);font-weight:600}
.main{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:6px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-secondary{background:#fff;color:var(--g700);border-color:var(--g300)}.btn-secondary:hover:not(:disabled){background:var(--g50)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover:not(:disabled){background:#DC2626}
.btn-ghost{background:transparent;color:var(--g500);border-color:var(--g200)}.btn-ghost:hover:not(:disabled){background:var(--g100)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover:not(:disabled){background:#059669}
.btn-sm{padding:4px 10px;font-size:12px}

/* ── Forms ── */
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.form-group label{font-weight:500;font-size:12px;color:var(--g700)}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--g300);border-radius:6px;background:#fff;outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=email]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.08)}
textarea{resize:vertical;min-height:72px}
select{appearance:none;background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 8px center;background-size:16px;padding-right:30px}

/* ── Tables ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--g200);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--g50);padding:9px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--g200);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--g100);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:var(--g100);color:var(--g700)}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600}
.badge-ok{background:var(--success-light);color:#065F46}
.badge-gray{background:var(--g100);color:var(--g500)}
.badge-warn{background:var(--warning-light);color:#92400E}
.dec-badge{display:inline-block;padding:2px 10px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.dec-interview{background:var(--success-light);color:#065F46}
.dec-push2nd{background:var(--warning-light);color:#92400E}
.dec-reject{background:var(--danger-light);color:#991B1B}
.dec-undecided{background:var(--g100);color:var(--g500)}

/* ── Stars ── */
.stars{display:flex;align-items:center;gap:1px}
.star{background:none;border:none;cursor:pointer;font-size:18px;color:var(--g300);padding:0;line-height:1;transition:color .1s}
.star.on{color:#F59E0B}
.star:hover{color:#F59E0B}
.rating-val{font-size:12px;color:var(--g500);margin-left:4px}

/* ── Rating bar ── */
.rbar-wrap{display:flex;align-items:center;gap:8px;flex:1}
.rbar-track{flex:1;height:5px;background:var(--g200);border-radius:3px;overflow:hidden}
.rbar-fill{height:5px;background:var(--primary);border-radius:3px}
.rbar-val{font-size:12px;color:var(--g500);width:28px}

/* ── Rating row ── */
.rrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.rlabel{font-size:12px;color:var(--g700);width:150px;flex-shrink:0}

/* ── Empty / Loading ── */
.empty{text-align:center;padding:48px 20px;color:var(--g400);font-size:14px}
.loading{text-align:center;padding:40px;color:var(--g400)}

/* ── Coffee Chats page ── */
.two-col{display:grid;grid-template-columns:370px 1fr;gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:20px}
.panel h2,.panel h3{font-size:15px;font-weight:700;margin-bottom:14px}
.chat-card{background:#fff;border:1px solid var(--g200);border-radius:8px;overflow:hidden;margin-bottom:8px;transition:box-shadow .15s}
.chat-card:hover{box-shadow:var(--shadow)}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;gap:10px}
.chat-name{font-weight:600;font-size:14px;display:block}
.chat-meta{font-size:12px;color:var(--g500)}
.avg-pip{background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:100px;font-size:12px;font-weight:600}
.chat-body{padding:12px 14px;border-top:1px solid var(--g100);background:var(--g50)}
.chat-entry-list{display:flex;flex-direction:column;gap:8px}
.chat-entry{background:#fff;border:1px solid var(--g200);border-radius:8px;overflow:hidden}
.chat-entry-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;gap:10px}
.chat-entry-body{padding:9px 12px;border-top:1px solid var(--g100)}
.chat-quote{font-style:italic;color:var(--g600);font-size:13px;border-left:3px solid var(--g200);padding-left:10px;margin:10px 0;line-height:1.6}

/* ── Upload page ── */
.drop-zone{border:2px dashed var(--g300);border-radius:12px;padding:48px;text-align:center;cursor:pointer;transition:all .2s;background:#fff}
.drop-zone:hover,.drop-zone.over{border-color:var(--primary);background:var(--primary-light)}
.drop-icon{font-size:36px;margin-bottom:10px}
.drop-zone p{color:var(--g500);font-size:13px}

/* ── Review page ── */
.review-layout{display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:start}
.rev-nav{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--g200);border-radius:8px;padding:9px 14px}
.nav-ctr{flex:1;text-align:center;font-weight:600;color:var(--g700)}
.app-card{background:#fff;border:1px solid var(--g200);border-radius:12px;overflow:hidden}
.app-card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px;border-bottom:1px solid var(--g100);background:linear-gradient(135deg,var(--primary-light),white);gap:10px}
.app-name{font-size:20px;font-weight:700;color:var(--g900)}
.app-name.anon{color:var(--g400);font-style:italic}
.app-meta{font-size:13px;color:var(--g500);margin-top:3px}
.sec{padding:14px 18px;border-bottom:1px solid var(--g100)}
.sec:last-child{border-bottom:none}
.sec-title{font-size:11px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.team-chips{display:flex;flex-wrap:wrap;gap:6px}
.team-chip{display:flex;align-items:center;gap:5px;background:var(--g50);border:1px solid var(--g200);border-radius:6px;padding:5px 10px}
.chip-rank{font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase}
.chip-team{font-size:13px;font-weight:600;color:var(--g700)}
.fr-q{font-size:13px;font-weight:600;color:var(--g700);margin-bottom:3px;margin-top:12px}
.fr-a{font-size:14px;color:var(--g700);line-height:1.65;white-space:pre-wrap}
.resume-link{display:inline-flex;align-items:center;gap:5px;background:var(--primary-light);color:var(--primary);padding:7px 12px;border-radius:6px;font-weight:500;font-size:13px}
.dec-btns{display:flex;gap:7px;flex-wrap:wrap}
.dec-btn{padding:7px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.dec-btn-interview{background:var(--success-light);color:#065F46}
.dec-btn-interview.on{border-color:var(--success);box-shadow:0 0 0 2px rgba(16,185,129,.2)}
.dec-btn-push2nd{background:var(--warning-light);color:#92400E}
.dec-btn-push2nd.on{border-color:var(--warning);box-shadow:0 0 0 2px rgba(245,158,11,.2)}
.dec-btn-reject{background:var(--danger-light);color:#991B1B}
.dec-btn-reject.on{border-color:var(--danger);box-shadow:0 0 0 2px rgba(239,68,68,.2)}
.dec-btn-undecided{background:var(--g100);color:var(--g500)}
.dec-btn-undecided.on{border-color:var(--g400)}
.sidebar{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;position:sticky;top:74px}
.sidebar h3{font-size:14px;font-weight:700;margin-bottom:14px}

/* ── Decision Tracker ── */
.inline-sel{background:none;border:none;border-radius:6px;padding:3px 6px;font-size:11px;font-weight:700;cursor:pointer;outline:none;min-width:100px;text-transform:uppercase;letter-spacing:.04em}
.inline-sel:focus{box-shadow:0 0 0 2px var(--primary)}
.inline-notes{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-size:13px;background:transparent;resize:none;font-family:inherit;outline:none;min-height:26px;overflow:hidden}
.inline-notes:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px rgba(79,70,229,.1)}
.stat-pill{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:10px 30px 10px 16px;cursor:pointer;transition:outline .1s;position:relative}
.stat-pill.sel{outline:2px solid var(--primary)}
.stat-num{font-size:22px;font-weight:700}
.stat-lbl{font-size:11px;color:var(--g500);margin-top:1px}
.stat-copy{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;color:var(--g400);padding:4px;border-radius:6px;display:flex}
.stat-copy:hover{color:var(--primary);background:var(--g100)}

/* ── Email ── */
.email-compose{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.email-tabs{display:flex;gap:2px;border-bottom:2px solid var(--g200);margin-bottom:16px}
.etab{padding:7px 14px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:13px;font-weight:500;cursor:pointer;color:var(--g500);transition:all .15s;border-radius:6px 6px 0 0}
.etab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.etab:hover:not(.on){color:var(--g700);background:var(--g50)}
.app-pick-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:8px 0}
.app-pick{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .1s}
.app-pick:hover{background:var(--g50)}
.app-pick label{font-size:13px;cursor:pointer;flex:1;min-width:0}
.app-email-sm{font-size:11px;color:var(--g400);display:block}
.email-preview-box{background:#fff;border:1px solid var(--g200);border-radius:12px;overflow:hidden}
.preview-head{padding:13px 18px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between}
.preview-body-wrap{padding:18px}
.preview-meta{background:var(--g50);border-radius:6px;padding:9px 12px;font-size:12px;margin-bottom:12px;color:var(--g500)}
.preview-meta strong{color:var(--g800)}
.preview-text{font-size:14px;line-height:1.7;color:var(--g700);white-space:pre-wrap;background:#fff;border:1px solid var(--g200);border-radius:6px;padding:14px}

/* ── Filter bar ── */
.filter-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#fff;border:1px solid var(--g200);border-radius:8px;padding:10px 14px}
.filter-bar input[type=text]{min-width:200px;flex:1}
.filter-count{font-size:12px;color:var(--g500);white-space:nowrap;margin-left:auto}

/* ── Toast ── */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:slideIn .2s ease;pointer-events:auto;max-width:320px}
.toast.success{background:#065F46;border-left:3px solid var(--success)}
.toast.error{background:#991B1B;border-left:3px solid var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}

/* ── Setup Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-wide{max-width:760px}
.modal h2{font-size:20px;font-weight:700;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--g500);margin-bottom:20px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--g200)}
.code-hint{background:var(--g50);border:1px solid var(--g200);border-radius:6px;padding:10px 12px;font-family:monospace;font-size:12px;color:var(--g700);margin-bottom:14px;line-height:1.6;white-space:pre}
.step-box{background:#F0FDF4;border:1px solid #D1FAE5;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.step-box p{font-size:12px;color:#065F46;line-height:1.7}
.step-box strong{font-weight:700}

/* ── Misc ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-header h2{font-size:20px;font-weight:700}
.settings-btn{margin-left:auto;padding:5px 11px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:3px}
@media(max-width:900px){.two-col,.review-layout,.email-compose{grid-template-columns:1fr}.sidebar{position:static}}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading dashboard…</div></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Toast system ────────────────────────────────────────────────
let toastId = 0;
let setToastsGlobal = null;

function toast(msg, type = 'default') {
  const id = ++toastId;
  setToastsGlobal && setToastsGlobal(t => [...t, { id, msg, type }]);
  setTimeout(() => setToastsGlobal && setToastsGlobal(t => t.filter(x => x.id !== id)), 3200);
}
toast.success = msg => toast(msg, 'success');
toast.error = msg => toast(msg, 'error');

function Toaster() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => { setToastsGlobal = setToasts; }, []);
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>
      ))}
    </div>
  );
}

// ── Icons (static SVGs, no emoji) ──────────────────────────────
function Icon({ children, size = 15, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={{ verticalAlign:'-2px', flexShrink:0, ...style }}>
      {children}
    </svg>
  );
}
const SettingsIcon = p => (
  <Icon {...p}>
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </Icon>
);
const SearchIcon = p => (
  <Icon {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>
);
const CheckCircleIcon = p => (
  <Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></Icon>
);
const CoffeeIcon = p => (
  <Icon {...p}>
    <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
    <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/>
    <line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/>
  </Icon>
);
const FileIcon = p => (
  <Icon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6"/></Icon>
);
const ClipboardIcon = p => (
  <Icon {...p}>
    <rect x="8" y="2" width="8" height="4" rx="1"/>
    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
  </Icon>
);
const CopyIcon = p => (
  <Icon {...p}>
    <rect x="9" y="9" width="13" height="13" rx="2"/>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
  </Icon>
);
const AlertTriangleIcon = p => (
  <Icon {...p}>
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
    <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
  </Icon>
);
const PaperclipIcon = p => (
  <Icon {...p}><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></Icon>
);
const EyeIcon = p => (

// Converts any Google Drive share-link format (open?id=, file/d/…/view, uc?id=)
// into the /preview form Drive will render inside an iframe.
function driveEmbedUrl(url) {
  const m = (url||'').match(/[-\w]{25,}/);
  if (!m) return url;
  return `https://drive.google.com/file/d/${m[0]}/preview`;
}

// ── Firebase helpers ────────────────────────────────────────────
let db = null;

function getDB() { return db; }

function useFirebase(path) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) { setLoading(false); return; }
    const ref = db.ref(path);
    ref.on('value', snap => { setData(snap.val()); setLoading(false); });
    return () => ref.off();
  }, [path]);
  return { data, loading };
}

function avg(ratings) {
  if (!ratings) return null;
  const v = Object.values(ratings);
  return v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(1) : null;
}

function normName(n) { return (n || '').toLowerCase().trim().replace(/\s+/g, ' '); }

const DECISION_LABELS = { undecided:'Undecided', interview:'Interview', push2nd:'Push to 2nd Choice', reject:'Reject' };

// "Push to 2nd Choice" swaps the applicant's 2nd choice into their tracked
// 1st-choice slot (and vice versa) the moment the decision is set, so
// Decision Tracker/filters/exports reflect the team they're actually being
// routed to. Guarded on the previous decision so re-clicking the same
// button doesn't swap the pair back and forth.
function decisionUpdatePayload(app, d) {
  const updates = { decision: d };
  if (d === 'push2nd' && app?.decision !== 'push2nd' && app?.teamRankings?.second) {
    updates.teamRankings = {
      ...app.teamRankings,
      first: app.teamRankings.second,
      second: app.teamRankings.first,
    };
  }
  return updates;
}

}

const initForm = {
  prospectName:'', email:'', leaderName:'',
  date: new Date().toISOString().split('T')[0],
  ratings:{ missionAlignment:3, passionWorkEthic:3, preparedness:3, cultureFit:3 },
  comments:'',
};

function CoffeeChatLog() {
  const [form, setForm] = useState(initForm);
  const [expandedProspect, setExpandedProspect] = useState(null);
  const [expandedEntry, setExpandedEntry] = useState(null);
  const [search, setSearch] = useState('');
  const [leaderFilter, setLeaderFilter] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [minScore, setMinScore] = useState('');
  const { data: raw, loading } = useFirebase('coffeeChats');

  const chats = raw
    ? Object.entries(raw).map(([id, v]) => ({ id, ...v })).sort((a,b) => b.createdAt - a.createdAt)
    : [];

  const leaders = Array.from(new Set(chats.map(c => c.leaderName).filter(Boolean))).sort();

  const filtered = chats.filter(c => {
    if (search) {
      const q = search.toLowerCase();
      if (!(c.prospectName||'').toLowerCase().includes(q) && !(c.email||'').toLowerCase().includes(q)) return false;
    }
    if (leaderFilter && c.leaderName !== leaderFilter) return false;
    if (dateFrom && c.date < dateFrom) return false;
    if (dateTo && c.date > dateTo) return false;
    if (minScore) {
      const a = avg(c.ratings);
      if (a === null || Number(a) < Number(minScore)) return false;
    }
    return true;
  });

  const clearFilters = () => { setSearch(''); setLeaderFilter(''); setDateFrom(''); setDateTo(''); setMinScore(''); };
  const filtersActive = search || leaderFilter || dateFrom || dateTo || minScore;

  // Group entries by prospect (keyed on email, falling back to name) while
  // keeping each individual logged chat intact underneath. `filtered` is
  // already sorted most-recent-first, so the first entry seen per prospect
  // also determines that prospect's position in the group list.
  const groups = [];
  const groupsByKey = new Map();
  for (const c of filtered) {
    const key = (c.email || c.prospectName || '').toLowerCase();
    let group = groupsByKey.get(key);
    if (!group) {
      group = { key, prospectName: c.prospectName, email: c.email, entries: [] };
      groupsByKey.set(key, group);
      groups.push(group);
    }
    group.entries.push(c);
  }

  const submit = async (e) => {
    e.preventDefault();
    if (!form.prospectName.trim() || !form.email.trim()) { toast.error('Name and email required'); return; }
    try {
      await db.ref('coffeeChats').push({ ...form, createdAt: Date.now() });
      toast.success('Coffee chat logged!');
      setForm(initForm);
    } catch(err) { toast.error(err.message); }
  };

  const del = async (id) => {
    if (!confirm('Delete this coffee chat?')) return;
    try { await db.ref(`coffeeChats/${id}`).remove(); toast.success('Deleted'); }
    catch { toast.error('Failed to delete'); }
  };

  return (
    <div className="two-col">
      {/* Form */}
      <div className="panel">
        <h2>Log a Coffee Chat</h2>
        <form onSubmit={submit}>
          <div className="form-group">
            <label>Prospect Name *</label>
            <input type="text" value={form.prospectName} placeholder="Full name" required
              onChange={e => setForm(f => ({ ...f, prospectName: e.target.value }))} />
          </div>
          <div className="form-group">
            <label>Prospect Email *</label>
            <input type="email" value={form.email} placeholder="email@example.com" required
              onChange={e => setForm(f => ({ ...f, email: e.target.value }))} />
          </div>
          <div className="form-group">
            <label>Leader Name</label>
            <input type="text" value={form.leaderName} placeholder="Your name"
              onChange={e => setForm(f => ({ ...f, leaderName: e.target.value }))} />
          </div>
          <div className="form-group">
            <label>Date</label>
            <input type="date" value={form.date}
              onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
          </div>
          <div className="form-group">
            <label>Ratings</label>
            {RATING_CATS.map(({ key, label }) => (
              <div key={key} className="rrow" style={{ marginBottom:'8px' }}>
                <span className="rlabel">{label}</span>
                <Stars value={form.ratings[key]}
                  onChange={v => setForm(f => ({ ...f, ratings: { ...f.ratings, [key]: v } }))} />
              </div>
            ))}
          </div>
          <div className="form-group">
            <label>Comments</label>
            <textarea value={form.comments} rows={3}
              placeholder="Notes, impressions, highlights…"
              onChange={e => setForm(f => ({ ...f, comments: e.target.value }))} />
          </div>
          <button type="submit" className="btn btn-primary" style={{ width:'100%' }}>Log Coffee Chat</button>
        </form>
      </div>

      {/* List */}
      <div>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px' }}>
          <h3 style={{ fontSize:'15px', fontWeight:700 }}>Logged Chats ({filtered.length})</h3>
          <input type="text" placeholder="Search name or email…" value={search} style={{ width:180 }}
            onChange={e => setSearch(e.target.value)} />
        </div>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8, alignItems:'center', marginBottom:'12px' }}>
          <select value={leaderFilter} onChange={e=>setLeaderFilter(e.target.value)} style={{ width:150 }}>
            <option value="">All leaders</option>
            {leaders.map(l => <option key={l} value={l}>{l}</option>)}
          </select>
          <input type="date" value={dateFrom} title="From date" style={{ width:135 }}
            onChange={e => setDateFrom(e.target.value)} />
          <span style={{ color:'var(--g400)', fontSize:12 }}>to</span>
          <input type="date" value={dateTo} title="To date" style={{ width:135 }}
            onChange={e => setDateTo(e.target.value)} />
          <select value={minScore} onChange={e=>setMinScore(e.target.value)} style={{ width:110 }}>
            <option value="">Any score</option>
            <option value="4">4+ stars</option>
            <option value="3">3+ stars</option>
            <option value="2">2+ stars</option>
            <option value="1">1+ stars</option>
          </select>
          {filtersActive && (
            <button type="button" className="btn btn-ghost btn-sm" onClick={clearFilters}>Clear filters</button>
          )}
        </div>
        {loading ? <div className="loading">Loading…</div>
          : filtered.length === 0 ? <div className="empty">{chats.length===0?'No chats logged yet.':'No results.'}</div>
          : groups.map(g => {
            const groupAvg = (g.entries.reduce((sum,e) => sum + Number(avg(e.ratings)||0), 0) / g.entries.length).toFixed(1);
            const prospectOpen = expandedProspect === g.key;
            return (
              <div key={g.key} className="chat-card">
                <div className="chat-head" onClick={() => setExpandedProspect(prospectOpen?null:g.key)}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <span className="chat-name">{g.prospectName}</span>
                    <span className="chat-meta">{g.email}{g.entries.length>1 && ` · ${g.entries.length} chats`}</span>
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
                    <span className="avg-pip"><StarIcon size={11}/> {groupAvg}</span>
                    <span style={{ color:'var(--g400)', fontSize:10 }}>{prospectOpen?'▲':'▼'}</span>
                  </div>
                </div>
                {prospectOpen && (
                  <div className="chat-body chat-entry-list">
                    {g.entries.map(c => {
                      const entryOpen = expandedEntry === c.id;
                      return (
                        <div key={c.id} className="chat-entry">
                          <div className="chat-entry-head" onClick={() => setExpandedEntry(entryOpen?null:c.id)}>
                            <span className="chat-meta">{c.date}{c.leaderName && ` · ${c.leaderName}`}</span>
                            <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
                              <span className="avg-pip"><StarIcon size={11}/> {avg(c.ratings)}</span>
                              <span style={{ color:'var(--g400)', fontSize:10 }}>{entryOpen?'▲':'▼'}</span>
                            </div>
                          </div>
                          {entryOpen && (
                            <div className="chat-entry-body">
                              {RATING_CATS.map(({ key, label }) => (
                                <div key={key} className="rrow"><span className="rlabel">{label}</span>
                                  <Stars value={c.ratings?.[key]||0} readOnly /></div>
                              ))}
                              {c.comments && <p className="chat-quote">"{c.comments}"</p>}
                              <button className="btn btn-danger btn-sm" style={{ marginTop:8 }} onClick={() => del(c.id)}>Delete</button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

const TPL_HEADERS = [
  'Timestamp','Email Address','First Name','Last Name','STUDENT Email','New or Returning Member?',
  'What is a small business you are passionate about and why? (200 words max)','Blinded Resume',
  "Rank the projects you're interested in joining:  1: MOST WANTED OPTION 7: LEAST WANTED OPTION [World Centric]",
  "Rank the projects you're interested in joining:  1: MOST WANTED OPTION 7: LEAST WANTED OPTION [Tara's Organic Ice Cream]",
  "Rank the projects you're interested in joining:  1: MOST WANTED OPTION 7: LEAST WANTED OPTION [Berkeley Humane]",
  "Rank the projects you're interested in joining:  1: MOST WANTED OPTION 7: LEAST WANTED OPTION [1951 Coffee]",
  "Rank the projects you're interested in joining:  1: MOST WANTED OPTION 7: LEAST WANTED OPTION [Advisory & Research]",
  "Rank the projects you're interested in joining:  1: MOST WANTED OPTION 7: LEAST WANTED OPTION [Kash Cafe]",
  "Rank the projects you're interested in joining:  1: MOST WANTED OPTION 7: LEAST WANTED OPTION [Other]",
  'Can you make our bi-weekly meeting time?','Any other questions/comments/concerns?',
  'Why are you interested in Roots Consulting? (200 words max)',
];
const TPL_EXAMPLE = [
  '9/1/2026 12:00:00','jane@berkeley.edu','Jane','Smith','jane@berkeley.edu','New',
  'I love how Blue Bottle treats every neighborhood cafe as its own community hub…',
  'https://drive.google.com/open?id=EXAMPLE_FILE_ID',
  '2','4','1','6','3','5','7','Yes','N/A',
  'Roots stood out to me because of its hands-on work with real small businesses…',
];

// Roots recruitment sheet has duplicate-named columns because the Google Form
// branches on New vs Returning member (Resume, Business Passion, the 7 project
// rank columns, meeting time, and comments each appear twice). These helpers
// find every matching column and `coalesce` picks whichever one that row
// actually filled in, since a response only ever answers one branch.
const cleanHeader = s => (s||'').replace(/\s+/g,' ').trim();
const headerHas = (h, needle) => cleanHeader(h).toLowerCase().includes(needle.toLowerCase());
const findIdx = (headers, test) => headers.findIndex(h => h && test(h));
const findAllIdx = (headers, test) => headers.reduce((acc,h,i) => (h && test(h) ? [...acc,i] : acc), []);
const coalesce = (row, idxs) => {
  for (const i of idxs) {
    const v = (row[i]||'').trim();
    if (v) return v;
  }
  return '';
};

const PROJECT_ALIASES = { 'a&r': 'Advisory & Research' };
function extractProject(header) {
  const m = (header||'').match(/\[([^\]]+)\]/);
  if (!m) return null;
  const raw = m[1].trim();
  return PROJECT_ALIASES[raw.toLowerCase()] || raw;
}

function ApplicationUpload() {
  const [preview, setPreview] = useState(null);
  const [importing, setImporting] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef();
  const { data: appsRaw } = useFirebase('applications');
  const { data: chatsRaw } = useFirebase('coffeeChats');

  const apps = appsRaw ? Object.entries(appsRaw).map(([id,v])=>({id,...v})).sort((a,b)=>b.createdAt-a.createdAt) : [];
  const chats = chatsRaw ? Object.entries(chatsRaw).map(([id,v]) => ({ id, ...v })) : [];

  const matchChat = name => chats.find(c => normName(c.prospectName) === normName(name)) || null;

  const parseFile = file => {
    if (!file?.name.endsWith('.csv')) { toast.error('Please upload a .csv file'); return; }
    Papa.parse(file, {
      header:false, skipEmptyLines:true,
      complete: ({ data }) => {
        if (data.length < 2) { toast.error('CSV is empty'); return; }
        const headers = data[0];
        const rows = data.slice(1);

        const iEmail = findIdx(headers, h => cleanHeader(h).toLowerCase()==='email address');
        const iFirst = findIdx(headers, h => cleanHeader(h).toLowerCase()==='first name');
        const iLast = findIdx(headers, h => cleanHeader(h).toLowerCase()==='last name');
        const iStudentEmail = findIdx(headers, h => headerHas(h,'student') && headerHas(h,'email'));
        const iMembership = findIdx(headers, h => headerHas(h,'new or returning'));
        const rankIdxs = findAllIdx(headers, h => headerHas(h,"rank the projects"));
        const resumeIdxs = findAllIdx(headers, h => headerHas(h,'resume'));
        const meetingIdxs = findAllIdx(headers, h => headerHas(h,'meeting time'));
        const commentsIdxs = findAllIdx(headers, h => headerHas(h,'other questions') && headerHas(h,'comments'));

        const rankGroups = new Map();
        rankIdxs.forEach(i => {
          const proj = extractProject(headers[i]);
          if (!proj) return;
          if (!rankGroups.has(proj)) rankGroups.set(proj, []);
          rankGroups.get(proj).push(i);
        });

        const mappedIdx = new Set(
          [iEmail,iFirst,iLast,iStudentEmail,iMembership,...resumeIdxs,...meetingIdxs,...commentsIdxs,...rankIdxs]
            .filter(i => i>=0)
        );

        const parsed = rows.map(row => {
          const firstName = iFirst>=0 ? (row[iFirst]||'').trim() : '';
          const lastName = iLast>=0 ? (row[iLast]||'').trim() : '';
          const prospectName = [firstName,lastName].filter(Boolean).join(' ');
          const match = matchChat(prospectName);

          const ranked = [];
          rankGroups.forEach((idxs, proj) => {
            const n = parseInt(coalesce(row, idxs), 10);
            if (!isNaN(n)) ranked.push({ proj, n });
          });
          ranked.sort((a,b) => a.n-b.n);

          const freeResponses = headers
            .map((h,i) => ({ h, i }))
            .filter(({h,i}) => h && !mappedIdx.has(i))
            .map(({h,i}) => ({ question: h, answer: (row[i]||'').trim() }))
            .filter(x => x.answer);

          return {
            prospectName, firstName, lastName,
            email: iEmail>=0 ? (row[iEmail]||'').trim() : '',
            studentEmail: iStudentEmail>=0 ? (row[iStudentEmail]||'').trim() : '',
            membershipStatus: iMembership>=0 ? (row[iMembership]||'').trim() : '',
            grade: '',
            teamRankings: {
              first: ranked[0]?.proj || '',
              second: ranked[1]?.proj || '',
              third: ranked[2]?.proj || '',
            },
            meetingAvailability: coalesce(row, meetingIdxs),
            commentsConcerns: coalesce(row, commentsIdxs),
            freeResponses,
            resumePath: coalesce(row, resumeIdxs),
            coffeeChatId: match?.id || null,
            decision: 'undecided',
            notes: '',
            createdAt: Date.now(),
          };
        }).filter(a => a.prospectName || a.email);
        setPreview(parsed);
        toast.success(`Parsed ${parsed.length} applications`);
      },
      error: err => toast.error('Parse error: ' + err.message),
    });
  };

  const doImport = async () => {
    if (!preview) return;
    setImporting(true);
    try {
      for (const a of preview) await db.ref('applications').push(a);
      toast.success(`Imported ${preview.length} applications!`);
      setPreview(null);
    } catch(err) { toast.error(err.message); }
    setImporting(false);
  };

  const del = async id => {
    if (!confirm('Delete this application?')) return;
    try { await db.ref(`applications/${id}`).remove(); toast.success('Deleted'); }
    catch { toast.error('Failed'); }
  };

  const clearAll = async () => {
    if (!confirm(`Delete ALL ${apps.length} applications?`)) return;
    try {
      for (const a of apps) await db.ref(`applications/${a.id}`).remove();
      toast.success('Cleared');
    } catch { toast.error('Failed'); }
  };

  const downloadTemplate = () => {
    const csv = Papa.unparse({ fields: TPL_HEADERS, data: [TPL_EXAMPLE] });
    const blob = new Blob([csv], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href:url, download:'application_template.csv' }).click();
    URL.revokeObjectURL(url);
  };

  const matched = preview?.filter(a => a.coffeeChatId).length || 0;

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
      <div className="page-header">
        <h2>Upload Applications</h2>
        <button className="btn btn-secondary" onClick={downloadTemplate}>↓ CSV Template</button>
      </div>

      {!preview && (
        <div className={`drop-zone ${dragOver?'over':''}`}
          onDragOver={e=>{e.preventDefault();setDragOver(true)}}
          onDragLeave={()=>setDragOver(false)}
          onDrop={e=>{e.preventDefault();setDragOver(false);parseFile(e.dataTransfer.files[0])}}
          onClick={()=>fileRef.current?.click()}
        >
          <div className="drop-icon"><FileIcon size={28}/></div>
          <p><strong>Drop your CSV here</strong> or click to browse</p>
          <p style={{ fontSize:12, marginTop:4, color:'var(--g400)' }}>Export the Roots application Google Sheet as CSV and drop it in as-is — every column is picked up automatically.</p>
          <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}}
            onChange={e=>parseFile(e.target.files[0])} />
        </div>
      )}

      {preview && (
        <div style={{ background:'#fff', border:'1px solid var(--g200)', borderRadius:12, overflow:'hidden' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 18px', borderBottom:'1px solid var(--g200)', gap:12 }}>
            <div>
              <strong>{preview.length} applications ready to import</strong>
              <div style={{ fontSize:12, color:'var(--g500)', marginTop:2 }}>
                {matched} matched to coffee chats · {preview.length - matched} without chat
              </div>
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button className="btn btn-secondary" onClick={()=>setPreview(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={doImport} disabled={importing}>
                {importing ? 'Importing…' : `Import ${preview.length}`}
              </button>
            </div>
          </div>
          <div className="tbl-wrap" style={{ border:'none', borderRadius:0 }}>
            <table><thead><tr>
              <th>Name</th><th>Email</th><th>Grade</th><th>1st Choice</th><th>Coffee Chat</th><th>Responses</th>
            </tr></thead><tbody>
              {preview.map((a,i) => (
                <tr key={i}>
                  <td style={{fontWeight:500}}>{a.prospectName||'—'}</td>
                  <td>{a.email||'—'}</td>
                  <td>{a.grade||'—'}</td>
                  <td>{a.teamRankings.first||'—'}</td>
                  <td>{a.coffeeChatId?<span className="badge badge-ok">✓ Matched</span>:<span className="badge badge-gray">None</span>}</td>
                  <td>{a.freeResponses.length}</td>
                </tr>
              ))}
            </tbody></table>
          </div>
        </div>
      )}

      {/* Existing */}
      <div style={{ background:'#fff', border:'1px solid var(--g200)', borderRadius:12, overflow:'hidden' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 18px', borderBottom:'1px solid var(--g200)' }}>
          <h3 style={{ fontSize:15, fontWeight:700, margin:0 }}>Imported ({apps.length})</h3>
          {apps.length>0 && <button className="btn btn-danger btn-sm" onClick={clearAll}>Clear All</button>}
        </div>
        {apps.length===0 ? <div className="empty">No applications imported yet.</div> : (
          <div className="tbl-wrap" style={{ border:'none', borderRadius:0 }}>
            <table><thead><tr>
              <th>Name</th><th>Email</th><th>Grade</th><th>1st Choice</th><th>Coffee Chat</th><th>Decision</th><th>Date</th><th></th>
            </tr></thead><tbody>
              {apps.map(a => (
                <tr key={a.id}>
                  <td style={{fontWeight:500}}>{a.prospectName}</td>
                  <td style={{color:'var(--g500)',fontSize:12}}>{a.email}</td>
                  <td>{a.grade||'—'}</td>
                  <td>{a.teamRankings?.first||'—'}</td>
                  <td>{a.coffeeChatId?<span className="badge badge-ok">✓</span>:<span className="badge badge-gray">None</span>}</td>
                  <td><span className={`dec-badge dec-${a.decision||'undecided'}`}>{DECISION_LABELS[a.decision||'undecided']}</span></td>
                  <td style={{color:'var(--g400)',fontSize:12}}>{a.createdAt?new Date(a.createdAt).toLocaleDateString():'—'}</td>
                  <td><button className="btn btn-ghost btn-sm" onClick={()=>del(a.id)}>✕</button></td>
                </tr>
              ))}
            </tbody></table>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  APPLICATION REVIEW
// ═══════════════════════════════════════════════════════════════
function ApplicationReview() {
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [showChat, setShowChat] = useState(true);
  const [showResume, setShowResume] = useState(false);
  const [noteDraft, setNoteDraft] = useState('');
  const [filters, setFilters] = useState({ team:'', chat:'all', decision:'all', search:'' });
  const { data: appsRaw } = useFirebase('applications');
  const { data: chatsRaw } = useFirebase('coffeeChats');

  const apps = appsRaw ? Object.entries(appsRaw).map(([id,v])=>({id,...v})).sort((a,b)=>(a.prospectName||'').localeCompare(b.prospectName||'')) : [];
  const chats = chatsRaw ? Object.entries(chatsRaw).map(([id,v]) => ({ id, ...v })) : [];
  const teams = [...new Set(apps.map(a=>a.teamRankings?.first).filter(Boolean))].sort();

  // Match live by prospect name rather than trusting a stored coffeeChatId —
  // that field is set once at CSV-import time and misses chats logged after
  // import (and historically was never set correctly, see ApplicationUpload).
  const chatsForName = name => chats
    .filter(c => normName(c.prospectName) === normName(name))
    .sort((a,b) => (b.createdAt||0)-(a.createdAt||0));

  const filtered = apps.filter(a => {
    if (filters.team && a.teamRankings?.first !== filters.team) return false;
    const hasChat = chatsForName(a.prospectName).length > 0;
    if (filters.chat === 'has' && !hasChat) return false;
    if (filters.chat === 'none' && hasChat) return false;
    if (filters.decision !== 'all' && (a.decision||'undecided') !== filters.decision) return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      if (!(a.prospectName||'').toLowerCase().includes(q) && !(a.email||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const safeIdx = Math.min(idx, Math.max(0, filtered.length-1));
  const cur = filtered[safeIdx];
  const curChats = cur ? chatsForName(cur.prospectName) : [];

  useEffect(() => { setNoteDraft(cur?.notes||''); }, [cur?.id]);
  useEffect(() => { setIdx(0); setRevealed(false); setShowResume(false); }, [JSON.stringify(filters)]);

  const setDecision = async d => {
    if (!cur) return;
    try {
      const updates = decisionUpdatePayload(cur, d);
      await db.ref(`applications/${cur.id}`).update(updates);
      toast.success(updates.teamRankings ? `Pushed to 2nd choice: ${updates.teamRankings.first}` : `Marked: ${DECISION_LABELS[d]||d}`);
    }
    catch { toast.error('Failed'); }
  };

  const saveNotes = async () => {
    if (!cur || noteDraft === (cur.notes||'')) return;
    try { await db.ref(`applications/${cur.id}`).update({ notes: noteDraft }); }
    catch { toast.error('Failed to save notes'); }
  };

  const nav = d => { setIdx(i => Math.max(0, Math.min(filtered.length-1, i+d))); setRevealed(false); setShowResume(false); };

  useEffect(() => {
    const h = e => {
      if (e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
      if (e.key==='ArrowLeft'||e.key==='ArrowUp') nav(-1);
      if (e.key==='ArrowRight'||e.key==='ArrowDown') nav(1);
      if (e.key==='1') setDecision('interview');
      if (e.key==='2') setDecision('push2nd');
      if (e.key==='3') setDecision('reject');
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [filtered, safeIdx]);

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
      <div className="filter-bar">
        <input type="text" placeholder="Search name or email…" value={filters.search}
          onChange={e => setFilters(f=>({...f,search:e.target.value}))} />
        <select value={filters.team} onChange={e=>setFilters(f=>({...f,team:e.target.value}))}>
          <option value="">All Teams</option>
          {teams.map(t=><option key={t}>{t}</option>)}
        </select>
        <select value={filters.chat} onChange={e=>setFilters(f=>({...f,chat:e.target.value}))}>
          <option value="all">All (Coffee Chat)</option>
          <option value="has">Has Chat</option>
          <option value="none">No Chat</option>
        </select>
        <select value={filters.decision} onChange={e=>setFilters(f=>({...f,decision:e.target.value}))}>
          <option value="all">All Decisions</option>
          <option value="undecided">Undecided</option>
          <option value="interview">Interview</option>
          <option value="push2nd">Push to 2nd Choice</option>
          <option value="reject">Reject</option>
        </select>
        <span className="filter-count">{filtered.length} applicants</span>
        <span style={{fontSize:11,color:'var(--g400)'}}>← → keys · 1=Interview 2=Push 2nd 3=Reject</span>
      </div>

      {apps.length===0 ? (
        <div className="empty" style={{padding:'80px 20px'}}>
          <p>No applications yet.</p>
          <p style={{fontSize:13,marginTop:4}}>Go to <strong>Upload Apps</strong> to import a CSV.</p>
        </div>
      ) : filtered.length===0 ? (
        <div className="empty" style={{padding:'80px 20px'}}>No applicants match your filters.</div>
      ) : (
        <div className="review-layout">
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <div className="rev-nav">
              <button className="btn btn-secondary" onClick={()=>nav(-1)} disabled={safeIdx===0}>← Prev</button>
              <span className="nav-ctr">{safeIdx+1} of {filtered.length}</span>
              <button className="btn btn-secondary" onClick={()=>nav(1)} disabled={safeIdx===filtered.length-1}>Next →</button>
            </div>

            {cur && (
              <div className="app-card">
                <div className="app-card-head">
                  <div>
                    <div className={`app-name ${!revealed?'anon':''}`}>
                      {revealed ? cur.prospectName : `Applicant #${safeIdx+1}`}
                    </div>
                    <div className="app-meta">
                      {revealed ? (
                        <>
                          {cur.email}
                          {cur.studentEmail && cur.studentEmail.toLowerCase()!==(cur.email||'').toLowerCase() && ` · student: ${cur.studentEmail}`}
                          {cur.grade && ` · ${cur.grade}`}
                        </>
                      ) : 'Identity hidden'}
                    </div>
                  </div>
                  <div style={{ display:'flex', gap:6, flexShrink:0 }}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setRevealed(s=>!s)}>
                      {revealed?<EyeOffIcon size={13}/>:<EyeIcon size={13}/>} {revealed?'Hide':'Show'} Identity
                    </button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setShowChat(s=>!s)}>
                      <CoffeeIcon size={13}/> {showChat?'Hide':'Show'} Chat
                    </button>
                  </div>
                </div>

                {/* Membership Status */}
                {cur.membershipStatus && (
                  <div className="sec">
                    <div className="sec-title">Membership Status</div>
                    <span className="badge badge-gray">{cur.membershipStatus}</span>
                  </div>
                )}

                {/* Rankings */}
                <div className="sec">
                  <div className="sec-title">Team Rankings</div>
                  <div className="team-chips">
                    {[['first','1st'],['second','2nd'],['third','3rd']].map(([k,l]) =>
                      cur.teamRankings?.[k] ? (
                        <div key={k} className="team-chip">
                          <span className="chip-rank">{l}</span>
                          <span className="chip-team">{cur.teamRankings[k]}</span>
                        </div>
                      ) : null
                    )}
                  </div>
                </div>

                {/* Meeting Availability */}
                {cur.meetingAvailability && (
                  <div className="sec">
                    <div className="sec-title">Can Make Bi-Weekly Meeting?</div>
                    <p className="fr-a">{cur.meetingAvailability}</p>
                  </div>
                )}

                {/* Free Responses */}
                {cur.freeResponses?.length>0 && (
                  <div className="sec">
                    <div className="sec-title">Free Responses</div>
                    {cur.freeResponses.map((fr,i)=>(
                      <div key={i}>
                        <div className="fr-q">{fr.question}</div>
                        <p className="fr-a">{fr.answer}</p>
                      </div>
                    ))}
                  </div>
                )}

                {/* Comments / Concerns */}
                {cur.commentsConcerns && (
                  <div className="sec">
                    <div className="sec-title">Comments / Concerns</div>
                    <p className="fr-a">{cur.commentsConcerns}</p>
                  </div>
                )}

                {/* Resume */}
                {cur.resumePath && (
                  <div className="sec">
                    <div className="sec-title">Resume</div>
                    <button type="button" className="resume-link" style={{border:'none',cursor:'pointer'}} onClick={()=>setShowResume(true)}>
                      <PaperclipIcon size={13}/> View Resume
                    </button>
                  </div>
                )}

                {/* Notes */}
                <div className="sec">
                  <div className="sec-title">Deliberation Notes</div>
                  <textarea value={noteDraft} rows={3} style={{width:'100%'}}
                    placeholder="Add notes…"
                    onChange={e=>setNoteDraft(e.target.value)}
                    onBlur={saveNotes} />
                </div>

                {/* Decision */}
                <div className="sec" style={{ background:'var(--g50)' }}>
                  <div className="sec-title">Decision</div>
                  <div className="dec-btns">
                    {['interview','push2nd','reject','undecided'].map(d=>(
                      <button key={d}
                        className={`dec-btn dec-btn-${d} ${(cur.decision||'undecided')===d?'on':''}`}
                        onClick={()=>setDecision(d)}
                      >{DECISION_LABELS[d]}</button>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Sidebar */}
          {showChat && (
            <div className="sidebar">
              <h3><CoffeeIcon size={15}/> Coffee Chat{curChats.length>1 ? `s (${curChats.length})` : ''}</h3>
              {curChats.length>0 ? (
                curChats.map((chat,i) => (
                  <div key={chat.id} style={i<curChats.length-1 ? { marginBottom:20, paddingBottom:16, borderBottom:'1px solid var(--g100)' } : undefined}>
                    <div style={{marginBottom:14}}>
                      <p style={{fontSize:13,marginBottom:4}}><strong>Leader:</strong> {chat.leaderName||'—'}</p>
                      <p style={{fontSize:13,marginBottom:4}}><strong>Date:</strong> {chat.date||'—'}</p>
                      <p style={{fontSize:13}}><strong>Avg:</strong> <StarIcon size={11}/> {avg(chat.ratings)}</p>
                    </div>
                    {RATING_CATS.map(({key,label})=>(
                      <div key={key} className="rrow"><span className="rlabel" style={{fontSize:12,width:130}}>{label}</span>
                        <RBar value={chat.ratings?.[key]||0} /></div>
                    ))}
                    {chat.comments && (
                      <div style={{marginTop:12}}>
                        <div style={{fontSize:11,fontWeight:700,color:'var(--g400)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Comments</div>
                        <blockquote style={{fontStyle:'italic',color:'var(--g600)',fontSize:13,borderLeft:'3px solid var(--g200)',paddingLeft:10,lineHeight:1.6}}>{chat.comments}</blockquote>
                      </div>
                    )}
                  </div>
                ))
              ) : (
                <div className="empty" style={{padding:'24px 0'}}>No coffee chat recorded.</div>
              )}
            </div>
          )}
        </div>
      )}

      {showResume && cur?.resumePath && (
        <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setShowResume(false)}}>
          <div className="modal modal-wide">
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
              <h2 style={{ marginBottom:0 }}>Resume</h2>
              <button className="btn btn-ghost btn-sm" onClick={()=>setShowResume(false)}><XIcon size={14}/></button>
            </div>
            <iframe src={driveEmbedUrl(cur.resumePath)} title="Resume preview"
              style={{ width:'100%', height:'75vh', border:'1px solid var(--g200)', borderRadius:8 }} />
            <div className="modal-footer">
              <a href={cur.resumePath} target="_blank" rel="noopener noreferrer" className="btn btn-secondary">Open in new tab</a>
              <button className="btn btn-primary" onClick={()=>setShowResume(false)}>Close</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  R1 INTERVIEWS
// ═══════════════════════════════════════════════════════════════
function R1Interviews() {
  const [preview, setPreview] = useState(null);
  const [importing, setImporting] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef();
  const [idx, setIdx] = useState(0);
  const [filters, setFilters] = useState({ decision:'all', search:'' });
  const { data: r1Raw } = useFirebase('r1Interviews');
  const { data: appsRaw } = useFirebase('applications');

  const entries = r1Raw ? Object.entries(r1Raw).map(([id,v])=>({id,...v})).sort((a,b)=>b.createdAt-a.createdAt) : [];
  const apps = appsRaw ? Object.entries(appsRaw).map(([id,v])=>({id,...v})) : [];

  // Form only asks for the applicant's name/email (no shared id with the
  // applications collection), so match by name first, falling back to
  // email — same precedence used for coffee chats.
  const matchApplication = (name, email) => {
    let m = apps.find(a => normName(a.prospectName) === normName(name));
    if (!m && email) m = apps.find(a => (a.email||'').toLowerCase().trim() === email.toLowerCase().trim());
    return m || null;
  };

  const parseFile = file => {
    if (!file?.name.endsWith('.csv')) { toast.error('Please upload a .csv file'); return; }
    Papa.parse(file, {
      header:false, skipEmptyLines:true,
      complete: ({ data }) => {
        if (data.length < 2) { toast.error('CSV is empty'); return; }
        const headers = data[0];
        const rows = data.slice(1);

        const iName = findIdx(headers, h => headerHas(h,'applicant') && headerHas(h,'name'));
        const iEmail = findIdx(headers, h => headerHas(h,'applicant') && headerHas(h,'email'));
        const iInt1 = findIdx(headers, h => headerHas(h,'interviewer') && headerHas(h,'1'));
        const iInt2 = findIdx(headers, h => headerHas(h,'interviewer') && headerHas(h,'2'));
        const iChoice1 = findIdx(headers, h => headerHas(h,'1st choice'));
        const iChoice2 = findIdx(headers, h => headerHas(h,'2nd choice'));
        const iMission = findIdx(headers, h => headerHas(h,'mission alignment'));
        const iPassion = findIdx(headers, h => headerHas(h,'passion'));
        const iCulture = findIdx(headers, h => headerHas(h,'culture fit'));
        const iPrep = findIdx(headers, h => headerHas(h,'preparedness'));
        const iCollab = findIdx(headers, h => headerHas(h,'collaboration'));

        const mappedIdx = new Set(
          [iName,iEmail,iInt1,iInt2,iChoice1,iChoice2,iMission,iPassion,iCulture,iPrep,iCollab].filter(i=>i>=0)
        );

        const parsed = rows.map(row => {
          const applicantName = iName>=0 ? (row[iName]||'').trim() : '';
          const applicantEmail = iEmail>=0 ? (row[iEmail]||'').trim() : '';
          const match = matchApplication(applicantName, applicantEmail);

          const freeResponses = headers
            .map((h,i) => ({ h, i }))
            .filter(({h,i}) => h && !mappedIdx.has(i))
            .map(({h,i}) => ({ question: h, answer: (row[i]||'').trim() }))
            .filter(x => x.answer);

          return {
            applicantName, applicantEmail,
            interviewer1: iInt1>=0 ? (row[iInt1]||'').trim() : '',
            interviewer2: iInt2>=0 ? (row[iInt2]||'').trim() : '',
            choice1: iChoice1>=0 ? (row[iChoice1]||'').trim() : '',
            choice2: iChoice2>=0 ? (row[iChoice2]||'').trim() : '',
            ratings: {
              missionAlignment: parseInt(row[iMission],10)||0,
              passionWorkEthic: parseInt(row[iPassion],10)||0,
              cultureFit: parseInt(row[iCulture],10)||0,
              preparedness: parseInt(row[iPrep],10)||0,
              collaboration: parseInt(row[iCollab],10)||0,
            },
            freeResponses,
            matchedApplicationId: match?.id || null,
            r1Decision: 'undecided',
            createdAt: Date.now(),
          };
        }).filter(e => e.applicantName || e.applicantEmail);

        setPreview(parsed);
        toast.success(`Parsed ${parsed.length} interview entries`);
      },
      error: err => toast.error('Parse error: ' + err.message),
    });
  };

  const doImport = async () => {
    if (!preview) return;
    setImporting(true);
    try {
      for (const e of preview) await db.ref('r1Interviews').push(e);
      toast.success(`Imported ${preview.length} interview entries!`);
      setPreview(null);
    } catch(err) { toast.error(err.message); }
    setImporting(false);
  };

  const del = async id => {
    if (!confirm('Delete this interview entry?')) return;
    try { await db.ref(`r1Interviews/${id}`).remove(); toast.success('Deleted'); }
    catch { toast.error('Failed'); }
  };

  const clearAll = async () => {
    if (!confirm(`Delete ALL ${entries.length} interview entries?`)) return;
    try {
      for (const e of entries) await db.ref(`r1Interviews/${e.id}`).remove();
      toast.success('Cleared');
    } catch { toast.error('Failed'); }
  };

  // r1Decision is tracked on the interview entry itself, independent of the
  // application's own `decision` field, per your call to keep the two
  // pipeline stages comparable rather than one overwriting the other.
  const setR1Decision = async (id, d) => {
    try { await db.ref(`r1Interviews/${id}`).update({ r1Decision:d }); }
    catch { toast.error('Failed'); }
  };

  const filtered = entries.filter(e => {
    if (filters.decision!=='all' && (e.r1Decision||'undecided')!==filters.decision) return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      if (!(e.applicantName||'').toLowerCase().includes(q) && !(e.applicantEmail||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const safeIdx = Math.min(idx, Math.max(0, filtered.length-1));
  const cur = filtered[safeIdx];
  const matchedApp = cur?.matchedApplicationId ? apps.find(a=>a.id===cur.matchedApplicationId) : null;

  const nav = d => setIdx(i => Math.max(0, Math.min(filtered.length-1, i+d)));
  useEffect(() => { setIdx(0); }, [JSON.stringify(filters)]);

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
      <div className="page-header">
        <h2>R1 Interviews</h2>
      </div>

      {!preview && (
        <div className={`drop-zone ${dragOver?'over':''}`}
          onDragOver={e=>{e.preventDefault();setDragOver(true)}}
          onDragLeave={()=>setDragOver(false)}
          onDrop={e=>{e.preventDefault();setDragOver(false);parseFile(e.dataTransfer.files[0])}}
          onClick={()=>fileRef.current?.click()}
        >
          <div className="drop-icon"><FileIcon size={28}/></div>
          <p><strong>Drop your R1 Interview CSV here</strong> or click to browse</p>
          <p style={{ fontSize:12, marginTop:4, color:'var(--g400)' }}>Export the R1 interview form's response sheet as CSV and drop it in as-is — every column is picked up automatically, matched to applicants by name (falling back to email).</p>
          <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}}
            onChange={e=>parseFile(e.target.files[0])} />
        </div>
      )}

      {preview && (
        <div style={{ background:'#fff', border:'1px solid var(--g200)', borderRadius:12, overflow:'hidden' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 18px', borderBottom:'1px solid var(--g200)', gap:12 }}>
            <div>
              <strong>{preview.length} interview entries ready to import</strong>
              <div style={{ fontSize:12, color:'var(--g500)', marginTop:2 }}>
                {preview.filter(e=>e.matchedApplicationId).length} matched to applications · {preview.filter(e=>!e.matchedApplicationId).length} unmatched
              </div>
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button className="btn btn-secondary" onClick={()=>setPreview(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={doImport} disabled={importing}>
                {importing ? 'Importing…' : `Import ${preview.length}`}
              </button>
            </div>
          </div>
          <div className="tbl-wrap" style={{ border:'none', borderRadius:0 }}>
            <table><thead><tr>
              <th>Applicant</th><th>Interviewer 1</th><th>Interviewer 2</th><th>Avg Rating</th><th>Application</th>
            </tr></thead><tbody>
              {preview.map((e,i) => (
                <tr key={i}>
                  <td style={{fontWeight:500}}>{e.applicantName||e.applicantEmail||'—'}</td>
                  <td>{e.interviewer1||'—'}</td>
                  <td>{e.interviewer2||'—'}</td>
                  <td>⭐ {avg(e.ratings)}</td>
                  <td>{e.matchedApplicationId?<span className="badge badge-ok">✓ Matched</span>:<span className="badge badge-warn">No match</span>}</td>
                </tr>
              ))}
            </tbody></table>
          </div>
        </div>
      )}

      {entries.length > 0 && !preview && (
        <>
          <div className="filter-bar">
            <input type="text" placeholder="Search applicant name or email…" value={filters.search}
              onChange={e => setFilters(f=>({...f,search:e.target.value}))} />
            <select value={filters.decision} onChange={e=>setFilters(f=>({...f,decision:e.target.value}))}>
              <option value="all">All Decisions</option>
              <option value="undecided">Undecided</option>
              <option value="interview">Interview</option>
              <option value="push2nd">Push to 2nd Choice</option>
              <option value="reject">Reject</option>
            </select>
            <span className="filter-count">{filtered.length} entries</span>

            <>
              <div className="rev-nav">
                <button className="btn btn-secondary" onClick={()=>nav(-1)} disabled={safeIdx===0}>← Prev</button>
                <span className="nav-ctr">{safeIdx+1} of {filtered.length}</span>
                <button className="btn btn-secondary" onClick={()=>nav(1)} disabled={safeIdx===filtered.length-1}>Next →</button>
              </div>

              {cur && (
                <div className="app-card">
                  <div className="app-card-head">
                    <div>
                      <div className="app-name">{cur.applicantName || 'Unknown Applicant'}</div>
                      <div className="app-meta">
                        {cur.applicantEmail}
                        {cur.interviewer1 && ` · Interviewer 1: ${cur.interviewer1}`}
                        {cur.interviewer2 && ` · Interviewer 2: ${cur.interviewer2}`}
                      </div>
                    </div>
                    <div style={{ display:'flex', gap:6, flexShrink:0, alignItems:'center' }}>
                      {cur.matchedApplicationId
                        ? <span className="badge badge-ok">✓ Matched to application</span>
                        : <span className="badge badge-warn"><AlertTriangleIcon size={11}/> No matching application</span>}
                      <button className="btn btn-danger btn-sm" onClick={()=>del(cur.id)}>Delete</button>
                    </div>
                  </div>

                  {(cur.choice1 || cur.choice2) && (
                    <div className="sec">
                      <div className="sec-title">Confirmed at Interview</div>
                      <div className="team-chips">
                        {cur.choice1 && <div className="team-chip"><span className="chip-rank">1st</span><span className="chip-team">{cur.choice1}</span></div>}
                        {cur.choice2 && <div className="team-chip"><span className="chip-rank">2nd</span><span className="chip-team">{cur.choice2}</span></div>}
                      </div>
                      {matchedApp?.teamRankings?.first && matchedApp.teamRankings.first!==cur.choice1 && (
                        <p style={{fontSize:12,color:'var(--g500)',marginTop:8}}>Originally ranked "{matchedApp.teamRankings.first}" 1st on their application — shown here for reference only, not overwritten.</p>
                      )}
                    </div>
                  )}

                  <div className="sec">
                    <div className="sec-title">Interview Ratings</div>
                    {R1_RATING_CATS.map(({key,label})=>(
                      <div key={key} className="rrow" style={{ marginBottom:'6px' }}>
                        <span className="rlabel">{label}</span>
                        <Stars value={cur.ratings?.[key]||0} readOnly />

                    ))}
                  </div>

                  {cur.freeResponses?.length>0 && (
                    <div className="sec">
                      <div className="sec-title">Interview Notes</div>
                      {cur.freeResponses.map((fr,i)=>(
                        <div key={i}>

                          <p className="fr-a">{fr.answer}</p>
