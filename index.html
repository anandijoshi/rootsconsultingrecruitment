                  <div className="sec" style={{ background:'var(--g50)' }}>
                    <div className="sec-title">Decision</div>
                    <div className="dec-btns">
                      {['interview','push2nd','reject'].map(d=>(
                        <button key={d}
                          className={`dec-btn dec-btn-${d} ${(cur.r1Decision||'undecided')===d?'on':''}`}
                          onClick={()=>setR1Decision(cur.id,d)}
                        >{DECISION_LABELS[d]}</button>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </>
          )}
        </>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  DECISION TRACKER
// ═══════════════════════════════════════════════════════════════
function DecisionTracker() {
  const [filters, setFilters] = useState({ team:'', chat:'all', decision:'all', search:'' });
  const [sort, setSort] = useState({ field:'prospectName', dir:'asc' });
  const [noteDrafts, setNoteDrafts] = useState({});
  const timers = useRef({});
  const { data: appsRaw } = useFirebase('applications');
  const { data: chatsRaw } = useFirebase('coffeeChats');

  const apps = appsRaw ? Object.entries(appsRaw).map(([id,v])=>({id,...v})) : [];
  const chats = chatsRaw || {};
  const teams = [...new Set(apps.map(a=>a.teamRankings?.first).filter(Boolean))].sort();

  const filtered = apps.filter(a => {
    if (filters.team && a.teamRankings?.first !== filters.team) return false;
    if (filters.chat==='has' && !a.coffeeChatId) return false;
    if (filters.chat==='none' && a.coffeeChatId) return false;
    if (filters.decision!=='all' && (a.decision||'undecided') !== filters.decision) return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      if (!(a.prospectName||'').toLowerCase().includes(q) && !(a.email||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const srt = [...filtered].sort((a,b) => {
    let va,vb;
    if (sort.field==='decision') { va=a.decision||'undecided'; vb=b.decision||'undecided'; }
    else if (sort.field==='chatRating') {
      const ca = a.coffeeChatId?chats[a.coffeeChatId]:null, cb=b.coffeeChatId?chats[b.coffeeChatId]:null;
      va=parseFloat(avg(ca?.ratings)||0); vb=parseFloat(avg(cb?.ratings)||0);
    } else if (sort.field==='grade') { va=a.grade||''; vb=b.grade||''; }
    else if (sort.field==='team') { va=a.teamRankings?.first||''; vb=b.teamRankings?.first||''; }
    else { va=a.prospectName||''; vb=b.prospectName||''; }
    if (va<vb) return sort.dir==='asc'?-1:1;
    if (va>vb) return sort.dir==='asc'?1:-1;
    return 0;
  });

  const toggleSort = field => setSort(s => ({ field, dir: s.field===field&&s.dir==='asc'?'desc':'asc' }));
  const si = f => sort.field===f?(sort.dir==='asc'?' ↑':' ↓'):' ↕';

  const setDecision = async (id, d) => {
    try {
      const app = apps.find(x => x.id === id);
      await db.ref(`applications/${id}`).update(decisionUpdatePayload(app, d));
    }
    catch { toast.error('Failed'); }
  };

  const updateNote = (id, val) => {
    setNoteDrafts(n => ({ ...n, [id]: val }));
    clearTimeout(timers.current[id]);
    timers.current[id] = setTimeout(async () => {
      try { await db.ref(`applications/${id}`).update({ notes:val }); }
      catch { toast.error('Failed to save notes'); }
    }, 700);
  };

  const noteVal = a => noteDrafts[a.id]!==undefined ? noteDrafts[a.id] : (a.notes||'');

  const exportCSV = () => {
    const rows = srt.map(a => {
      const c = a.coffeeChatId ? chats[a.coffeeChatId] : null;
      return { Name:a.prospectName, Email:a.email, Grade:a.grade||'', '1st Choice':a.teamRankings?.first||'',
               'Coffee Chat':a.coffeeChatId?'Yes':'No', 'Chat Rating':c?avg(c.ratings):'',
               Decision:a.decision||'undecided', Notes:a.notes||'' };
    });
    const csv = Papa.unparse(rows);
    const blob = new Blob([csv], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href:url, download:`decisions_${new Date().toISOString().split('T')[0]}.csv` }).click();
    URL.revokeObjectURL(url);
    toast.success('Exported!');
  };

  const counts = apps.reduce((acc,a)=>{const d=a.decision||'undecided';acc[d]=(acc[d]||0)+1;return acc},{});

  const copyEmails = async d => {
    const emails = apps.filter(a => (a.decision||'undecided')===d && a.email).map(a => a.email);
    if (!emails.length) { toast.error(`No emails for ${DECISION_LABELS[d]}`); return; }
    try {
      await navigator.clipboard.writeText(emails.join(', '));
      toast.success(`Copied ${emails.length} email${emails.length>1?'s':''}`);
    } catch { toast.error('Failed to copy — clipboard access denied'); }
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
      <div className="page-header">
        <h2>Decision Tracker</h2>
        <button className="btn btn-secondary" onClick={exportCSV} disabled={!srt.length}>↓ Export CSV</button>
      </div>

      {apps.length>0 && (
        <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
          {['undecided','interview','push2nd','reject'].map(d=>(
            <div key={d} className={`stat-pill ${filters.decision===d?'sel':''}`}
              onClick={()=>setFilters(f=>({...f,decision:f.decision===d?'all':d}))}>
              <button type="button" className="stat-copy" title={`Copy ${DECISION_LABELS[d]} emails`}
                onClick={e=>{e.stopPropagation(); copyEmails(d);}}>
                <CopyIcon size={12}/>
              </button>
              <div className="stat-num">{counts[d]||0}</div>
              <div className="stat-lbl">{DECISION_LABELS[d]}</div>
            </div>
          ))}
          <div className="stat-pill"><div className="stat-num">{apps.length}</div><div className="stat-lbl">Total</div></div>
        </div>
      )}

      <div className="filter-bar">
        <input type="text" placeholder="Search…" value={filters.search}
          onChange={e=>setFilters(f=>({...f,search:e.target.value}))} />
        <select value={filters.team} onChange={e=>setFilters(f=>({...f,team:e.target.value}))}>
          <option value="">All Teams</option>{teams.map(t=><option key={t}>{t}</option>)}
        </select>
        <select value={filters.chat} onChange={e=>setFilters(f=>({...f,chat:e.target.value}))}>
          <option value="all">All (Coffee Chat)</option>
          <option value="has">Has Chat</option>
          <option value="none">No Chat</option>
        </select>
        <select value={filters.decision} onChange={e=>setFilters(f=>({...f,decision:e.target.value}))}>
          <option value="all">All Decisions</option>
          <option value="undecided">Undecided</option>
          <option value="interview">Interview</option>
          <option value="push2nd">Push to 2nd Choice</option>
          <option value="reject">Reject</option>
        </select>
        <span className="filter-count">{srt.length} shown</span>
      </div>

      {apps.length===0 ? (
        <div className="empty" style={{padding:'80px 20px'}}>No applications yet. Upload a CSV first.</div>
      ) : (
        <div className="tbl-wrap">
          <table>
            <thead><tr>
              <th style={{width:32}}>#</th>
              <th className="sortable" onClick={()=>toggleSort('prospectName')}>Name{si('prospectName')}</th>
              <th>Email</th>
              <th className="sortable" onClick={()=>toggleSort('grade')}>Grade{si('grade')}</th>
              <th className="sortable" onClick={()=>toggleSort('team')}>1st Choice{si('team')}</th>
              <th className="sortable" onClick={()=>toggleSort('chatRating')}>Coffee Chat{si('chatRating')}</th>
              <th className="sortable" onClick={()=>toggleSort('decision')}>Decision{si('decision')}</th>
              <th style={{minWidth:200}}>Notes</th>
            </tr></thead>
            <tbody>
              {srt.map((a,i)=>{
                const c=a.coffeeChatId?chats[a.coffeeChatId]:null;
                const d=a.decision||'undecided';
                return (
                  <tr key={a.id}>
                    <td style={{color:'var(--g400)',fontSize:12}}>{i+1}</td>
                    <td style={{fontWeight:500}}>{a.prospectName}</td>
                    <td style={{color:'var(--g500)',fontSize:12}}>{a.email}</td>
                    <td>{a.grade||'—'}</td>
                    <td>{a.teamRankings?.first||'—'}</td>
                    <td>{c
                      ?<span style={{display:'flex',alignItems:'center',gap:4}}><span className="badge badge-ok">✓</span><span style={{fontSize:12,color:'var(--g500)',display:'inline-flex',alignItems:'center',gap:2}}><StarIcon size={11}/>{avg(c.ratings)}</span></span>
                      :<span className="badge badge-gray">None</span>}
                    </td>
                    <td>
                      <select className={`inline-sel dec-badge dec-${d}`} value={d}
                        onChange={e=>setDecision(a.id,e.target.value)}>
                        {['undecided','interview','push2nd','reject'].map(x=>(
                          <option key={x} value={x}>{DECISION_LABELS[x]}</option>
                        ))}
                      </select>
                    </td>
                    <td>
                      <textarea className="inline-notes" value={noteVal(a)}
                        onChange={e=>updateNote(a.id,e.target.value)}
                        placeholder="Add notes…" rows={1}
                        onFocus={e=>e.target.rows=3} onBlur={e=>e.target.rows=1} />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  SETUP MODAL
// ═══════════════════════════════════════════════════════════════
function SetupModal({ onSave }) {
  const [cfg, setCfg] = useState({
    apiKey: '', authDomain: '', databaseURL: '', projectId: '',
    storageBucket: '', messagingSenderId: '', appId: '',
  });
  const [pasteMode, setPasteMode] = useState(false);
  const [raw, setRaw] = useState('');

  const parseRaw = () => {
    const lines = raw.split('\n');
    const get = key => {
      const l = lines.find(x=>x.trim().startsWith(key));
      return l ? l.split(':').slice(1).join(':').trim().replace(/[",]/g,'') : '';
    };
    setCfg({
      apiKey: get('apiKey'),
      authDomain: get('authDomain'),
      databaseURL: get('databaseURL'),
      projectId: get('projectId'),
      storageBucket: get('storageBucket'),
      messagingSenderId: get('messagingSenderId'),
      appId: get('appId'),
    });
    setPasteMode(false);
    toast.success('Config parsed! Review and save.');
  };

  const save = () => {
    if (!cfg.apiKey || !cfg.databaseURL) { toast.error('API Key and Database URL are required'); return; }
    localStorage.setItem('firebase_config', JSON.stringify(cfg));
    onSave(cfg);
  };

  return (
    <div className="overlay">
      <div className="modal">
        <h2>🌱 Welcome to Roots Recruitment</h2>
        <p className="sub">Connect your Firebase Realtime Database to get started. Your config is stored locally in your browser.</p>

        <div className="step-box">
          <p>
            <strong>Quick setup:</strong><br/>
            1. Go to <a href="https://firebase.google.com" target="_blank" rel="noopener">firebase.google.com</a> → create a project<br/>
            2. Build → Realtime Database → Create Database (test mode)<br/>
            3. Project Settings → Your Apps → Web → Register → copy the config
          </p>
        </div>

        {pasteMode ? (
          <>
            <div className="form-group">
              <label>Paste your entire firebaseConfig object here</label>
              <textarea value={raw} rows={10} style={{ fontFamily:'monospace', fontSize:12 }}
                placeholder={`const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  databaseURL: "...",\n  projectId: "...",\n  storageBucket: "...",\n  messagingSenderId: "...",\n  appId: "..."\n};`}
                onChange={e=>setRaw(e.target.value)} />
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button className="btn btn-primary" onClick={parseRaw}>Parse Config</button>
              <button className="btn btn-ghost" onClick={()=>setPasteMode(false)}>Enter Manually</button>
            </div>
          </>
        ) : (
          <>
            <button className="btn btn-secondary" style={{ marginBottom:14, width:'100%' }} onClick={()=>setPasteMode(true)}>
              <ClipboardIcon size={13}/> Paste Firebase Config Object (Easier)
            </button>
            {Object.entries({
              apiKey:'API Key *', authDomain:'Auth Domain', databaseURL:'Database URL *',
              projectId:'Project ID', storageBucket:'Storage Bucket',
              messagingSenderId:'Messaging Sender ID', appId:'App ID',
            }).map(([k,label])=>(
              <div key={k} className="form-group">
                <label>{label}</label>
                <input type="text" value={cfg[k]}
                  placeholder={k==='databaseURL'?'https://your-project-default-rtdb.firebaseio.com':''}
                  onChange={e=>setCfg(c=>({...c,[k]:e.target.value}))} />
              </div>
            ))}
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={save} style={{ width:'100%' }}>Save & Connect</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  SETTINGS MODAL
// ═══════════════════════════════════════════════════════════════
function SettingsModal({ onClose }) {
  const saved = JSON.parse(localStorage.getItem('firebase_config')||'{}');
  const [cfg, setCfg] = useState(saved);

  const save = () => {
    localStorage.setItem('firebase_config', JSON.stringify(cfg));
    toast.success('Settings saved — reload to apply Firebase changes');
    onClose();
  };

  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal">
        <h2><SettingsIcon size={17}/> Settings</h2>
        <p className="sub">Config is stored in your browser's localStorage.</p>

        <h3 style={{ fontSize:14, fontWeight:700, margin:'16px 0 10px' }}>Firebase Config</h3>
        {['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId'].map(k=>(
          <div key={k} className="form-group">
            <label>{k}</label>
            <input type="text" value={cfg[k]||''} onChange={e=>setCfg(c=>({...c,[k]:e.target.value}))} />
          </div>
        ))}

        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save Settings</button>
        </div>
      </div>
    </div>
  );
}

        }
      });

    } catch(e) {
      setDbError(e.message);
    }
  }, []);

      db = firebase.app().database();
    } else {
      firebase.initializeApp(cfg);
      db = firebase.database();
    }
  };

  const handleSetup = (cfg) => {
    try {
      initFirebase(cfg);
      setShowSetup(false);
      setReady(true);
      toast.success('Connected to Firebase!');
